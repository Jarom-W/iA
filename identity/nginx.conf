server {
    listen 8080;
    server_name auth.inflectionarchitectures.com;
    client_max_body_size 1m;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = / { return 302 https://auth.inflectionarchitectures.com/realms/inflection/account/; }
    location /realms/inflection/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host auth.inflectionarchitectures.com;
        proxy_set_header X-Forwarded-Host auth.inflectionarchitectures.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
    location /resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host auth.inflectionarchitectures.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
    }
    location / { return 404; }
}
