{% extends 'base.html' %}{% block content %}<a class="text-link" href="{{ url_for('clients') }}">← All clients</a><div class="page-heading"><div><p class="eyebrow">BUILD A GOOD RELATIONSHIP</p><h1>{{ 'Edit client.' if client else 'Meet your next client.' }}</h1><p class="intro">A home for the people you build things with.</p></div></div><form method="post" class="panel form-stack form-wide">{{ csrf() }}<div class="form-grid"><label>Business / client name<input name="name" required maxlength="160" value="{{ request.form.get('name',client.name if client else '') }}"></label><label>Contact person<input name="contact" maxlength="160" value="{{ request.form.get('contact',client.contact if client else '') }}"></label><label>Email<input name="email" type="email" maxlength="254" value="{{ request.form.get('email',client.email if client else '') }}"></label><label>Phone<input name="phone" type="tel" maxlength="80" value="{{ request.form.get('phone',client.phone if client else '') }}"></label><label>Hourly rate ({{ currency }})<input name="rate" type="number" min="0" max="100000" step="0.01" required value="{{ request.form.get('rate','%.2f'|format(client.rate_cents/100) if client else '') }}"><small>Rate changes apply to future sessions. Past work keeps its original rate.</small></label><label>Client color<select name="color">{% for color in colors %}<option value="{{ color }}" {% if request.form.get('color',client.color if client else 'green')==color %}selected{% endif %}>{{ color|capitalize }}</option>{% endfor %}</select></label></div><label>Relationship notes <span class="muted">· private</span><textarea name="notes" rows="5" maxlength="6000" placeholder="What matters to them? Goals, context, and things to remember.">{{ request.form.get('notes',client.notes if client else '') }}</textarea></label><div class="form-actions"><a class="text-link" href="{{ url_for('clients') }}">Cancel</a><button class="button">Save client {{ icon('arrow') }}</button></div></form>{% endblock %}
