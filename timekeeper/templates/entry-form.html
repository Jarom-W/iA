{% extends 'base.html' %}{% block content %}
<div class="page-heading"><div><h1>{{ title }}</h1><p class="intro">Record a meeting or work you did without the timer, or correct a past session.</p></div></div>
<form method="post" class="panel form-stack form-wide" data-journal="manual" data-rate-form>{{ csrf() }}
<input type="hidden" name="revision" value="{{ entry.revision if entry else 0 }}"><input type="hidden" name="creation_token" value="{{ creation_token }}">
<div class="form-grid"><label>Client<select name="client_id" required data-rate-client><option value="">Choose client</option>{% for client in clients %}<option value="{{ client.id }}" {% if request.form.get('client_id',entry.client_id if entry else selected)==client.id %}selected{% endif %} {% if client.archived and (not entry or entry.client_id!=client.id) %}disabled{% endif %}>{{ client.name }}{{ ' (archived)' if client.archived else '' }}</option>{% endfor %}</select></label>
{% set allow_custom=true %}{% include 'rate-picker.html' %}
<label>Start date and time<input name="started_at" type="datetime-local" required value="{{ request.form.get('started_at',(entry.started_at|local).strftime('%Y-%m-%dT%H:%M') if entry else default_start) }}"><small>{{ timezone_name }}. Used to place this work on the calendar.</small></label>
<label>Hours worked<input name="hours" type="number" min="0.000001" max="744" step="any" required value="{{ request.form.get('hours','%.6f'|format((entry.ended_at-entry.started_at)/3600) if entry else '') }}"><small>For example: 1.5 = 1 hour 30 minutes. End time is calculated from the start.</small></label></div>
<div class="form-grid" data-custom-rate><label>Custom rate name<input name="custom_label" maxlength="100" value="{{ request.form.get('custom_label','') }}"></label><label>Custom hourly rate ({{ currency }})<input name="custom_rate" type="number" min="0" max="100000" step="0.01" value="{{ request.form.get('custom_rate','') }}"></label></div>
<label>Session summary<input name="summary" required maxlength="2000" value="{{ request.form.get('summary',entry.summary if entry else '') }}" placeholder="Clarion internal planning meeting"></label>
<label>Work completed & deliverables<textarea name="deliverables" required maxlength="6000" rows="5">{{ request.form.get('deliverables',entry.deliverables if entry else '') }}</textarea><small>Included in client reports and monthly line-item descriptions.</small></label>
<label>Next steps<textarea name="next_steps" maxlength="3000" rows="3">{{ request.form.get('next_steps',entry.next_steps if entry else '') }}</textarea></label>
<label>Internal notes · private<textarea name="private_notes" maxlength="6000" rows="3">{{ request.form.get('private_notes',entry.private_notes if entry else '') }}</textarea><small>Excluded from reports, monthly descriptions, and CSV exports.</small></label>
<div class="form-actions"><a class="text-link" href="{{ url_for('work_log') }}">Cancel</a><button class="button">Save time entry</button></div>
</form>{% endblock %}
