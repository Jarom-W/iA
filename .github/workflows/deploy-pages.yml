name: Deploy website

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out website
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build website
        working-directory: frontend
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

  feedback-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ./platform_auth -r feedback/requirements.txt
      - run: python -m unittest discover -s feedback/tests -v
        env:
          PYTHONPATH: feedback
      - name: Build feedback container
        run: docker build -t ia-feedback:ci -f feedback/Dockerfile .
      - name: Smoke-test feedback container
        run: >-
          docker run --rm --read-only --tmpfs /tmp --entrypoint python ia-feedback:ci -c
          'from app import create_app; from werkzeug.security import generate_password_hash;
          app=create_app({"TESTING":True,"SECRET_KEY":"ci-only-not-a-production-secret-value","ADMIN_PASSWORD_HASH":generate_password_hash("ci-only"),"DATABASE_PATH":"/tmp/smoke.sqlite3"});
          assert app.test_client().get("/health").status_code == 200'

  timekeeper-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ./platform_auth -r timekeeper/requirements.txt pypdf==6.21.4
      - run: python -m unittest discover -s timekeeper/tests -v
        env:
          PYTHONPATH: timekeeper
      - name: Build time workspace container
        run: docker build -t ia-time:ci -f timekeeper/Dockerfile .
      - name: Smoke-test time workspace container
        run: >-
          docker run --rm --read-only --tmpfs /tmp --entrypoint python ia-time:ci -c
          'from app import create_app; from werkzeug.security import generate_password_hash;
          app=create_app({"TESTING":True,"SECRET_KEY":"ci-only-not-a-production-secret-value","ADMIN_PASSWORD_HASH":generate_password_hash("ci-only"),"DATABASE_PATH":"/tmp/time-smoke.sqlite3"});
          assert app.test_client().get("/health").status_code == 200'

      - name: Smoke-test the production server with two workers
        run: |
          TIME_SMOKE_PASSWORD_HASH="$(python -c 'from werkzeug.security import generate_password_hash; print(generate_password_hash("ci-only"))')"
          docker run -d --name ia-time-server --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            -e TIME_SECRET_KEY=ci-only-not-a-production-secret-value \
            -e ADMIN_PASSWORD_HASH="$TIME_SMOKE_PASSWORD_HASH" ia-time:ci
          trap 'docker logs ia-time-server; docker rm -f ia-time-server' EXIT
          for attempt in $(seq 1 20); do
            if docker exec ia-time-server python -c 'import urllib.request; assert urllib.request.urlopen("http://127.0.0.1:8000/health").status == 200'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  identity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ./platform_auth -r feedback/requirements.txt -r timekeeper/requirements.txt pypdf==6.21.4
      - run: python -m unittest discover -s platform_auth/tests -v
      - name: Build production identity image
        run: docker build -t ia-identity:ci identity
      - name: Verify real OIDC sign-in and access management
        run: |
          python identity/configure.py --test --directory /tmp/ia-identity
          docker run -d --name ia-identity-test -p 127.0.0.1:8098:8080 \
            -v /tmp/ia-identity/secrets/realm.json:/opt/keycloak/data/import/realm.json:ro \
            quay.io/keycloak/keycloak:26.8.1 start-dev --import-realm --hostname http://127.0.0.1:8098
          trap 'docker logs ia-identity-test; docker rm -f ia-identity-test' EXIT
          python identity/test_integration.py /tmp/ia-identity

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, feedback-test, timekeeper-test, identity-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
