# Use with: docker compose -f compose.yaml -f compose.tunnel.yaml up -d --build
services:
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets:
      - tunnel_token
    depends_on:
      feedback:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
secrets:
  tunnel_token:
    file: ./secrets/tunnel_token
