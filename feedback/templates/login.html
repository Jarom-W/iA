{% extends 'base.html' %}{% block content %}<div class="narrow"><p class="eyebrow">Client feedback / Admin</p><h1>Welcome back.</h1><p>Manage your forms, invitations, and client stories.</p>{% if central_auth %}<a class="button" href="{{ url_for('platform_auth.login') }}">Continue to central sign-in →</a>{% else %}<form method="post" class="panel stack"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label for="username">Login</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>Sign in →</button></form>{% endif %}</div>{% endblock %}
