services:
  feedback:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8091:8000"
    volumes:
      - feedback-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  feedback-data:
