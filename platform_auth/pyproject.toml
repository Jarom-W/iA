[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-platform-auth"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["Authlib==1.9.1", "requests==2.34.2", "cryptography==50.0.2", "Flask==3.1.3"]

[tool.setuptools.packages.find]
include = ["ia_auth*"]

[tool.setuptools.package-data]
ia_auth = ["templates/access/*.html"]
