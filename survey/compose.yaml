services:
  survey:
    build:
      context: ..
      dockerfile: survey/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8096:8000"
    volumes:
      - survey-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  survey-data:
