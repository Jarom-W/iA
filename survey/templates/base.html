<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#030303"><title>{{ title }} · iA Surveys</title><link rel="icon" href="{{ url_for('static',filename='favicon.svg') }}"><link rel="stylesheet" href="{{ url_for('static',filename='survey.css') }}"><script defer src="{{ url_for('static',filename='survey.js') }}"></script></head><body><header><a class="brand" href="{{ url_for('dashboard') if request.path.startswith('/admin') else 'https://inflectionarchitectures.com' }}"><img src="{{ url_for('static',filename='brand.svg') }}" alt="Inflection Architectures"></a><span class="eyebrow">PRODUCT SURVEYS</span>{% if request.path.startswith('/admin') %}<nav><a href="{{ url_for('dashboard') }}">All surveys</a><form method="post" action="{{ url_for('platform_auth.logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="outline small">Sign out</button></form></nav>{% endif %}</header><main>{% for message in get_flashed_messages() %}<p class="notice" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main><footer><span>Inflection Architectures</span><span>Thoughtful products start with good questions.</span></footer></body></html>
